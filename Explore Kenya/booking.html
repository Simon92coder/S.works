<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Now | Explore Kenya</title>
<meta name="description" content="Book your Kenya trip.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Young+Serif&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
<a class="logo" href="index.html">Explore Kenya</a>
<nav aria-label="Main">
<a href="index.html">Home</a>
<a href="destinations.html">Destinations</a>
<a href="packages.html">Packages</a>
<a href="booking.html" aria-current="page">Book Now</a>
<a href="contact.html">Contact</a>
</nav></div></header>
<main>
<div class="page-title"><div class="wrap"><h1>Book your trip</h1><p>Send your details and we will confirm availability and price within one working day.</p></div></div>
<section><div class="wrap">
<form action="#" method="post">
<div class="two">
<label>Full name <input type="text" name="name" required></label>
<label>Email <input type="email" name="email" required></label>
</div>
<label>Destination <select name="destination">
<option>Maasai Mara</option><option>Amboseli</option><option>Diani Beach</option><option>Lamu Old Town</option><option>Mount Kenya</option><option>Lake Nakuru</option></select></label>
<label>Package <select name="package"><option>Mara Classic</option><option>Big Five Circuit</option><option>Coast Escape</option><option>Mount Kenya Trek</option><option>Custom trip</option></select></label>
<div class="two">
<label>Travel date <input type="date" name="date" required></label>
<label>Travellers <input type="number" name="travellers" min="1" max="20" value="2" required></label>
</div>
<label>Special requests <textarea name="notes" rows="4"></textarea></label>
<button class="btn dark" type="submit">Send booking request</button>
<p class="note">No payment is taken here. A 30% deposit is requested after we confirm.</p>
</form></div></section>
</main>
<footer><div class="wrap">&copy; 2026 Explore Kenya Safaris. Karibu Kenya, you are welcome.</div></footer>
</body></html>
